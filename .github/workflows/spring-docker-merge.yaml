name: Spring App CI/CD For Merge

on:
  push:
    branches:
      - test
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04
    steps:
    - uses: actions/checkout@v3
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Cache Gradle dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
    - name: Build with Gradle
      run: ./gradlew build
    - name: Build Docker image
      run: docker build . --file Dockerfile --tag ${{ secrets.DOCKERHUB_ORGNIZATIONS }}/pol-back:latest
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Push Docker image
      run: docker push ${{ secrets.DOCKERHUB_ORGNIZATIONS }}/pol-back:latest

  deploy:
    needs: build
    runs-on: ubuntu-20.04
    steps:
    - name: Deploy
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        script: |
          docker pull ${{ secrets.DOCKERHUB_ORGNIZATIONS }}/pol-back:latest
          docker stop pol-back || true
          docker rm pol-back || true
          docker run -d --name pol-back -p 8080:8080 \
            -v ${{ secrets.APP_DIR_LOGS }}:/app/logs \
            -e SPRING_PROFILES_ACTIVE=develop \
            -e LOGGING_FILE_NAME=/app/logs/pol-back.log \
            -e DB_URL='${{ secrets.DB_URL }}' \
            -e DB_USERNAME='${{ secrets.DB_USERNAME }}' \
            -e DB_PASSWORD='${{ secrets.DB_PASSWORD }}' \
            -e JWT_SECRET='${{ secrets.JWT_SECRET }}' \
            -e MAIL_SECRET='${{ secrets.MAIL_SECRET }}' \
            -e SPRING_MAIL_HOST='${{ secrets.SPRING_MAIL_HOST }}' \
            -e SPRING_MAIL_PORT='${{ secrets.SPRING_MAIL_PORT }}' \
            -e SPRING_MAIL_USERNAME='${{ secrets.SPRING_MAIL_USERNAME }}' \
            -e SPRING_MAIL_PASSWORD='${{ secrets.SPRING_MAIL_PASSWORD }}' \
            -e SPRING_MAIL_SMTP_AUTH='${{ secrets.SPRING_MAIL_SMTP_AUTH }}' \
            -e SPRING_MAIL_SMTP_STARTTLS_ENABLE='${{ secrets.SPRING_MAIL_SMTP_STARTTLS_ENABLE }}' \
            -e HOST_DEPLOY_API_SERVER='${{ secrets.HOST_DEPLOY_API_SERVER }}' \
            -e HOST_DEVELOP_API_SERVER='${{ secrets.HOST_DEVELOP_API_SERVER }}' \
            -e HOST_DEVELOP_API_ANT_MATCH_URI='${{ secrets.HOST_DEVELOP_API_ANT_MATCH_URI }}' \
            -e OAUTH2_GOOGLE_CLIENT_ID='${{ secrets.OAUTH2_GOOGLE_CLIENT_ID }}' \
            -e OAUTH2_GOOGLE_CLIENT_SECRET='${{ secrets.OAUTH2_GOOGLE_CLIENT_SECRET }}' \
            -e OAUTH2_GOOGLE_REDIRECT_URI='${{ secrets.OAUTH2_GOOGLE_REDIRECT_URI }}' \
            -e OAUTH2_GOOGLE_TOKEN_URI='${{ secrets.OAUTH2_GOOGLE_TOKEN_URI }}' \
            -e OAUTH2_GOOGLE_RESOURCE_URI='${{ secrets.OAUTH2_GOOGLE_RESOURCE_URI }}' \
            -e OAUTH2_KAKAO_CLIENT_ID='${{ secrets.OAUTH2_KAKAO_CLIENT_ID }}' \
            -e OAUTH2_KAKAO_REDIRECT_URI='${{ secrets.OAUTH2_KAKAO_REDIRECT_URI }}' \
            -e OAUTH2_KAKAO_TOKEN_URI='${{ secrets.OAUTH2_KAKAO_TOKEN_URI }}' \
            -e OAUTH2_KAKAO_RESOURCE_URI='${{ secrets.OAUTH2_KAKAO_RESOURCE_URI }}' \
            -e OAUTH2_NAVER_CLIENT_ID='${{ secrets.OAUTH2_NAVER_CLIENT_ID }}' \
            -e OAUTH2_NAVER_CLIENT_SECRET='${{ secrets.OAUTH2_NAVER_CLIENT_SECRET }}' \
            -e OAUTH2_NAVER_REDIRECT_URI='${{ secrets.OAUTH2_NAVER_REDIRECT_URI }}' \
            -e OAUTH2_NAVER_TOKEN_URI='${{ secrets.OAUTH2_NAVER_TOKEN_URI }}' \
            -e OAUTH2_NAVER_RESOURCE_URI='${{ secrets.OAUTH2_NAVER_RESOURCE_URI }}' \
            -e OAUTH2_GITHUB_CLIENT_ID='${{ secrets.OAUTH2_GITHUB_CLIENT_ID }}' \
            -e OAUTH2_GITHUB_CLIENT_SECRET='${{ secrets.OAUTH2_GITHUB_CLIENT_SECRET }}' \
            -e OAUTH2_GITHUB_REDIRECT_URI='${{ secrets.OAUTH2_GITHUB_REDIRECT_URI }}' \
            -e OAUTH2_GITHUB_TOKEN_URI='${{ secrets.OAUTH2_GITHUB_TOKEN_URI }}' \
            -e OAUTH2_GITHUB_RESOURCE_URI='${{ secrets.OAUTH2_GITHUB_RESOURCE_URI }}' \
            ${{ secrets.DOCKERHUB_ORGNIZATIONS }}/pol-back:latest
