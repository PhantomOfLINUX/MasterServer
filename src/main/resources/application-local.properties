spring.datasource.url=jdbc:h2:mem:master;MODE=MariaDB;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.defer-datasource-initialization=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

jwt.secret=local-development-jwt-secret-key-for-hs256-tests

spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=local
spring.mail.password=local
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
mail.secret=local-mail-secret

host.deploy.api.server=http://localhost:8080
host.develop.api.server=http://localhost:8080
host.develop.api.ant-match.uri=/home,/index,/index.js,/favicon.ico,/swagger-ui,/v3,/api/todo-list,/api/auth,/h2-console

oauth2.google.client-id=local-google-client-id
oauth2.google.client-secret=local-google-client-secret
oauth2.google.redirect-uri=http://localhost:8080/api/auth/google/callback
oauth2.google.token-uri=https://oauth2.googleapis.com/token
oauth2.google.resource-uri=https://www.googleapis.com/oauth2/v2/userinfo

oauth2.kakao.client-id=local-kakao-client-id
oauth2.kakao.redirect-uri=http://localhost:8080/api/auth/kakao/callback
oauth2.kakao.token-uri=https://kauth.kakao.com/oauth/token
oauth2.kakao.resource-uri=https://kapi.kakao.com/v2/user/me

oauth2.naver.client-id=local-naver-client-id
oauth2.naver.client-secret=local-naver-client-secret
oauth2.naver.redirect-uri=http://localhost:8080/api/auth/naver/callback
oauth2.naver.token-uri=https://nid.naver.com/oauth2.0/token
oauth2.naver.resource-uri=https://openapi.naver.com/v1/nid/me

oauth2.github.client-id=local-github-client-id
oauth2.github.client-secret=local-github-client-secret
oauth2.github.redirect-uri=http://localhost:8080/api/auth/github/callback
oauth2.github.token-uri=https://github.com/login/oauth/access_token
oauth2.github.resource-uri=https://api.github.com/user
